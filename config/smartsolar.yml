# smartsolard configuration. Every value shown is the default; the paths are the Linux (tsOS) ones.
# macOS: ~/Library/Application Support/smartsolar. Windows: %PROGRAMDATA%\smartsolar and
# socket: tcp://127.0.0.1:47821 (see docs/platforms.md).

ble:
  enabled: true                  # false: no Bluetooth at all (a system that only has the VE.Direct cable)
  # adapter: hci0
  # address: "F7:48:18:8A:77:9D"   # pin a device (disables RSSI selection and switching); a MAC address,
  #                                  # a serial number ("HQ22294ZGEU") or, on macOS, the device UUID
  select_window_s: 10            # listen this long before the first device selection
  rescan_interval_s: 3600        # how often the selection is reviewed
  switch_hysteresis_db: 10       # another device must be this much stronger to replace the current one

advert:
  # The Instant Readout advertisements are the main data source. The device sends a new reading
  # about once a second; one is published every publish_interval_s.
  publish_interval_s: 60
  stale_after_s: 120             # measured gaps with the Wi-Fi access point up: up to 22 s

gatt:
  # off:  no connection, except once to fetch the Instant Readout key if none is configured
  # hold: keep a GATT connection and publish the values the device pushes (needs a working
  #       connection: with the 2.4 GHz access point up, opening one mostly fails)
  # poll: connect every poll_interval_s, collect the values, disconnect
  mode: "off"
  passkey: "000000"              # the pairing passkey of the device (Victron default)
  poll_interval_s: 900
  collect_s: 15
  keepalive_s: 5                 # the device closes the link 10 s after the last ping
  connect_timeout_s: 30
  pair_timeout_s: 20
  request_timeout_s: 10
  backoff_initial_s: 5
  backoff_max_s: 300
  publish_interval_s: 60         # hold mode

serial:
  # The VE.Direct cable (19200 baud). Text blocks arrive every second; with hex on, the same
  # cable also reads and writes settings (smartsolar write / profile load). Only one program may
  # read the port: do not enable this while another reader (e.g. mqttutil's vedirect) uses it.
  enabled: false
  port: /dev/ttyUSBvd*             # a port, or a pattern: the first match is used (re-checked at every open)
  baud: 19200
  publish_interval_s: 60
  stale_after_s: 10
  hex: true                      # false: read only, the daemon never sends a byte
  request_timeout_s: 2
  reopen_initial_s: 2            # the port went away (USB unplugged): retry with backoff
  reopen_max_s: 60

keys:
  # Instant Readout key of each device, by MAC address, serial number or (macOS) device UUID (VictronConnect: device > settings > Product info >
  # Instant readout via Bluetooth). If a device has no key here, the daemon reads it over GATT
  # once (it needs a working connection) and stores it in daemon.state_dir. This file is a secret.
  # "F7:48:18:8A:77:9D": "00112233445566778899aabbccddeeff"

daemon:
  socket: /run/smartsolar/smartsolar.sock
  socket_mode: "0660"            # octal
  state_dir: /var/lib/smartsolar # fetched keys
  registers: auto                # settings go through: auto (the cable if it answers, else GATT), serial, gatt
  log_level: INFO
  csv:
    enabled: true
    path: /data
  mqtt:
    enabled: true
    host: localhost
    port: 1883
    qos: 0
    json: true
    cbor: true
