name: Release

# A release is made by pushing a tag vX.Y.Z (or vX.Y.Z-rc.1 for a pre-release):
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
# The tag must match __version__ in src/smartsolar/__init__.py and CHANGELOG.md needs a
# section for it; the section becomes the release notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag against the version and the changelog
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          code="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/smartsolar/__init__.py').read_text()).group(1))")"
          if [ "$version" != "$code" ]; then
            echo "::error::tag $tag does not match __version__ $code in src/smartsolar/__init__.py"
            exit 1
          fi
          python - "$version" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version}")
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          PY
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag $flags
