[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsolar"
authors = [
  {name = "Jonas Höchst", email = "hoechst@trackit.systems"}
]
dynamic = ["version"]
description = "Daemon and CLI for Victron SmartSolar charge controllers over BLE (Instant Readout and GATT) and VE.Direct"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "dbus-fast; sys_platform == 'linux'",  # the BlueZ pairing agent (bleak brings it on Linux, too)
    "cbor2",
    "cryptography",
    "paho-mqtt>=2",
    "PyYAML>=6",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "dbus-fast; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/trackIT-Systems/pysmartsolar"

[project.scripts]
smartsolar = "smartsolar.cli:main"
smartsolard = "smartsolar.daemon:main"

[tool.setuptools.dynamic]
version = {attr = "smartsolar.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
